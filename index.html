<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Restoran - Belajar Data Handling</title>
    
    <!-- CSS External -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <!-- Navbar / Header -->
    <header class="bg-orange-600 text-white p-6 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight">Warung Nusantara 🍽️</h1>
            <p class="hidden sm:block text-orange-100">Cita Rasa Asli Indonesia</p>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-6xl mx-auto p-6 mt-6">
        
        <!-- Bagian Filter -->
        <div class="mb-8 text-center sm:text-left">
            <h2 class="text-xl font-semibold mb-4">Kategori Menu:</h2>
            <div class="flex flex-wrap gap-2 justify-center sm:justify-start">
                <button onclick="filterKategori('Semua')" class="px-4 py-2 bg-gray-800 text-white rounded-full hover:bg-gray-700 transition">Semua</button>
                <button onclick="filterKategori('Makanan Utama')" class="px-4 py-2 bg-orange-100 text-orange-800 rounded-full hover:bg-orange-200 transition">Makanan Utama</button>
                <button onclick="filterKategori('Minuman')" class="px-4 py-2 bg-blue-100 text-blue-800 rounded-full hover:bg-blue-200 transition">Minuman</button>
                <button onclick="filterKategori('Camilan')" class="px-4 py-2 bg-yellow-100 text-yellow-800 rounded-full hover:bg-yellow-200 transition">Camilan</button>
            </div>
        </div>

        <!-- Container untuk List Menu -->
        <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Item menu akan di-generate oleh JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-6 mt-12">
        <p>&copy; 2026 Belajar Data Handling - Array & JSON.</p>
    </footer>

    <!-- JS External -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
