<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Restoran - Belajar Data Handling</title>
    
    <!-- CSS External -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar / Header -->
    <header>
        <div class="container">
            <h1>Warung Nusantara 🍽️</h1>
            <p>Cita Rasa Asli Indonesia</p>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="container">
        
        <!-- Bagian Filter -->
        <div class="filter-section">
            <h2>Kategori Menu:</h2>
            <div class="filter-buttons">
                <button onclick="filterKategori('Semua')" class="btn btn-all">Semua</button>
                <button onclick="filterKategori('Makanan Utama')" class="btn btn-utama">Makanan Utama</button>
                <button onclick="filterKategori('Minuman')" class="btn btn-minuman">Minuman</button>
                <button onclick="filterKategori('Camilan')" class="btn btn-camilan">Camilan</button>
            </div>
        </div>

        <!-- Container untuk List Menu -->
        <div id="menu-container" class="menu-grid">
            <!-- Item menu akan di-generate oleh JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Belajar Data Handling - Array & JSON.</p>
        </div>
    </footer>

    <!-- JS External -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
